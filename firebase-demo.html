<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Data Realtime (Firebase)</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --primary: #2563EB;
            --background: #F8FAFC;
            --surface: #FFFFFF;
            --text: #1E293B;
            --danger: #EF4444;
            --border: #E2E8F0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: var(--background);
            color: var(--text);
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 24px;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: 0.2s;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        button:hover {
            opacity: 0.9;
        }

        /* Mode Control */
        .admin-only {
            display: none;
        }

        body.admin-mode .admin-only {
            display: inline-block;
        }

        body.admin-mode .login-btn {
            display: none;
        }

        body:not(.admin-mode) .logout-btn {
            display: none;
        }

        /* Card System */
        .cards-container {
            display: grid;
            gap: 20px;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        }

        .card {
            background: var(--surface);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

        .card h3 {
            margin-bottom: 10px;
            font-size: 18px;
        }

        .card .category {
            display: inline-block;
            padding: 4px 12px;
            background: #DBEAFE;
            color: var(--primary);
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .card p {
            font-size: 14px;
            color: #64748B;
            margin-bottom: 15px;
        }

        .card-actions {
            display: flex;
            gap: 10px;
        }

        /* Modals */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--surface);
            padding: 30px;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
        }

        .modal-content h2 {
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-family: inherit;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>Dashboard Konten</h1>
        <div>
            <button id="addBtn" class="btn-primary admin-only">Tambah Data</button>
            <button id="loginBtn" class="btn-primary login-btn">Login Admin</button>
            <button id="logoutBtn" class="btn-danger logout-btn">Logout Admin</button>
        </div>
    </div>

    <div class="cards-container" id="cardsContainer">
        <!-- Cards dirender dari Firebase -->
    </div>

    <!-- Login Modal -->
    <div class="modal" id="loginModal">
        <div class="modal-content">
            <h2>Login Admin</h2>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="loginPassword" placeholder="Masukkan Password Admin">
            </div>
            <div class="modal-actions">
                <button type="button" class="btn-danger"
                    onclick="document.getElementById('loginModal').classList.remove('active')">Batal</button>
                <button type="button" class="btn-primary" id="submitLoginBtn">Login</button>
            </div>
        </div>
    </div>

    <!-- Data Modal (Add/Edit) -->
    <div class="modal" id="dataModal">
        <div class="modal-content">
            <h2 id="modalTitle">Tambah Data</h2>
            <input type="hidden" id="cardId">
            <div class="form-group">
                <label>Judul</label>
                <input type="text" id="inputTitle" required>
            </div>
            <div class="form-group">
                <label>Kategori</label>
                <input type="text" id="inputCategory" required>
            </div>
            <div class="form-group">
                <label>Deskripsi</label>
                <textarea id="inputDesc" rows="4" required></textarea>
            </div>
            <div class="modal-actions">
                <button type="button" class="btn-danger"
                    onclick="document.getElementById('dataModal').classList.remove('active')">Batal</button>
                <button type="button" class="btn-primary" id="saveDataBtn">Simpan</button>
            </div>
        </div>
    </div>

    <!-- Firebase Logic -->
    <script type="module">
        // 1. IMPORT FIREBASE MODULAR (v9)
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, getDoc, serverTimestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

        // 2. CONFIGURATION (GANTI DENGAN CONFIG ANDA)
        const firebaseConfig = {
            apiKey: "AIzaSyDl3wX5h-AM9vOg3qtePl6wAl2vNS_lN2Y",
            authDomain: "kabinnet12-d8305.firebaseapp.com",
            projectId: "kabinnet12-d8305",
            storageBucket: "kabinnet12-d8305.firebasestorage.app",
            messagingSenderId: "504059668634",
            appId: "1:504059668634:web:d31810dff98697b9801723"
        };

        // 3. INITIALIZATION
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const cardsCol = collection(db, "cards");

        // State Global
        window.isAdmin = false;

        // 4. AUTHENTICATION STATE OBSERVER
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                try {
                    // Validasi Role dari collection 'users'
                    const userDoc = await getDoc(doc(db, "users", user.uid));
                    if (userDoc.exists() && userDoc.data().role === "admin") {
                        window.isAdmin = true;
                        document.body.classList.add("admin-mode");
                    } else {
                        throw new Error("Bukan Admin");
                    }
                } catch (e) {
                    await signOut(auth);
                    window.isAdmin = false;
                    document.body.classList.remove("admin-mode");
                }
            } else {
                window.isAdmin = false;
                document.body.classList.remove("admin-mode");
            }
        });

        // 5. LOGIN ADMIN (Tanpa Input Email)
        document.getElementById('loginBtn').addEventListener('click', () => {
            document.getElementById('loginPassword').value = '';
            document.getElementById('loginModal').classList.add('active');
        });

        document.getElementById('submitLoginBtn').addEventListener('click', async () => {
            const password = document.getElementById('loginPassword').value;
            if (!password) return alert("Password wajib diisi!");

            try {
                // Email hardcoded untuk internal system
                const email = "admin@kabinnet.com";
                await signInWithEmailAndPassword(auth, email, password);

                // Cek role via GetDoc
                const user = auth.currentUser;
                const userDoc = await getDoc(doc(db, "users", user.uid));

                if (userDoc.exists() && userDoc.data().role === "admin") {
                    document.getElementById('loginModal').classList.remove('active');
                    alert("Berhasil login sebagai Admin!");
                } else {
                    await signOut(auth);
                    alert("Akses ditolak: Akun tidak memiliki akses admin.");
                }
            } catch (error) {
                alert("Login gagal: " + error.message);
            }
        });

        // 6. LOGOUT ADMIN
        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await signOut(auth);
            alert("Berhasil logout!");
        });

        // 7. REALTIME DATA FETCH (onSnapshot)
        const q = query(cardsCol, orderBy("createdAt", "desc"));
        onSnapshot(q, (snapshot) => {
            const container = document.getElementById('cardsContainer');
            container.innerHTML = ''; // Clear container

            if (snapshot.empty) {
                container.innerHTML = '<p>Belum ada data...</p>';
                return;
            }

            snapshot.forEach(docSnap => {
                const data = docSnap.data();
                const id = docSnap.id;

                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="category">${data.category || 'Umum'}</div>
                    <h3>${data.title}</h3>
                    <p>${data.desc}</p>
                    <div class="card-actions admin-only">
                        <button class="btn-primary" onclick="window.editDataTrigger('${id}', '${data.title}', '${data.desc}', '${data.category}')">Edit</button>
                        <button class="btn-danger" onclick="window.deleteDataTrigger('${id}')">Hapus</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }, (error) => {
            console.error("Error fetching data realtime: ", error);
        });

        // 8. CRUD ACTIONS
        // Setup Modal Add
        document.getElementById('addBtn').addEventListener('click', () => {
            document.getElementById('modalTitle').innerText = 'Tambah Data';
            document.getElementById('cardId').value = '';
            document.getElementById('inputTitle').value = '';
            document.getElementById('inputCategory').value = '';
            document.getElementById('inputDesc').value = '';
            document.getElementById('dataModal').classList.add('active');
        });

        // Edit Trigger (Global Scope for inline onclick)
        window.editDataTrigger = (id, title, desc, category) => {
            document.getElementById('modalTitle').innerText = 'Edit Data';
            document.getElementById('cardId').value = id;
            document.getElementById('inputTitle').value = title;
            document.getElementById('inputCategory').value = category;
            document.getElementById('inputDesc').value = desc;
            document.getElementById('dataModal').classList.add('active');
        };

        // Delete Trigger
        window.deleteDataTrigger = async (id) => {
            if (!window.isAdmin) return alert("Hanya Admin yang bisa menghapus data!");
            if (confirm("Yakin ingin menghapus data ini?")) {
                try {
                    await deleteDoc(doc(db, "cards", id));
                } catch (e) {
                    alert("Error: " + e.message);
                }
            }
        };

        // Save Data (Add / Update)
        document.getElementById('saveDataBtn').addEventListener('click', async () => {
            if (!window.isAdmin) return alert("Hanya Admin yang bisa menyimpan data!");

            const id = document.getElementById('cardId').value;
            const title = document.getElementById('inputTitle').value;
            const category = document.getElementById('inputCategory').value;
            const desc = document.getElementById('inputDesc').value;

            if (!title || !category || !desc) return alert("Harap isi semua kolom!");

            const submitBtn = document.getElementById('saveDataBtn');
            submitBtn.innerText = 'Menyimpan...';
            submitBtn.disabled = true;

            try {
                if (id) {
                    // Update
                    await updateDoc(doc(db, "cards", id), {
                        title, desc, category
                    });
                } else {
                    // Add
                    await addDoc(cardsCol, {
                        title, desc, category,
                        createdAt: serverTimestamp()
                    });
                }
                document.getElementById('dataModal').classList.remove('active');
            } catch (e) {
                alert("Error menyimpan data: " + e.message);
            } finally {
                submitBtn.innerText = 'Simpan';
                submitBtn.disabled = false;
            }
        });

    </script>
</body>

</html>
