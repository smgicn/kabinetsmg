<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Demo: Popup Pengumuman Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --primary-light: #dbeafe;
      --background: #ffffff;
      --background-soft: #f9fafb;
      --border: #e5e7eb;
      --text-primary: #1e293b;
      --text-muted: #94a3b8;
      --radius-lg: 16px;
      --transition: all 0.3s ease;
    }
    body {font-family: 'Inter', sans-serif; margin:0; background: var(--background-soft);}
    /* Overlay */
    .announcement-overlay {position:fixed; inset:0; background:rgba(0,0,0,0.45); backdrop-filter:blur(4px); display:flex; justify-content:center; align-items:center; z-index:9999; opacity:0; transition:opacity .3s;}
    .announcement-overlay.visible {opacity:1;}
    .announcement-card {background:rgba(255,255,255,0.85); border-radius:var(--radius-lg); max-width:420px; width:90%; max-height:80vh; padding:1.5rem; overflow:auto; box-shadow:0 4px 16px rgba(0,0,0,0.06); transform:scale(0.95); transition:transform .3s;}
    .announcement-overlay.visible .announcement-card {transform:scale(1);}
    .announcement-close {position:absolute; top:.6rem; right:.6rem; background:transparent; border:none; font-size:1.4rem; color:var(--text-muted); cursor:pointer;}
    .announcement-close:hover {color:var(--text-primary);}
    .announcement-title {margin-bottom:.8rem; font-size:1.3rem; font-weight:600;}
    .announcement-body {line-height:1.6;}
    .btn {display:inline-block; width:100%; padding:.6rem 1rem; background:var(--primary); color:#fff; border:none; border-radius:8px; cursor:pointer; font-weight:600; margin-top:1rem;}
    .btn:hover {background:var(--primary-dark);}  
  </style>
</head>
<body>
  <!-- Popup markup -->
  <div id="announcement-overlay" class="announcement-overlay hidden" aria-hidden="true">
    <div class="announcement-card" role="dialog" aria-modal="true" aria-labelledby="announcement-title">
      <button id="announcement-close" class="announcement-close" aria-label="Tutup">×</button>
      <h2 id="announcement-title" class="announcement-title">PENGUMUMAN UPDATE KPI</h2>
      <div id="announcement-body" class="announcement-body">
        <p>Selamat datang di dashboard KPI terbaru.</p>
        <ul>
          <li>Target bulan Mei telah diperbarui</li>
          <li>Silakan cek data masing-masing</li>
          <li>Panduan penggunaan dapat dilihat di: <a href="https://example.com" target="_blank">https://example.com</a></li>
        </ul>
        <p>Terima kasih.</p>
      </div>
      <button id="announcement-ack" class="btn">Tutup</button>
    </div>
  </div>

  <script>
    // Simulate login success – show popup once per session
    document.addEventListener('DOMContentLoaded', () => {
      if (sessionStorage.getItem('announcementSeen')) return;
      const overlay = document.getElementById('announcement-overlay');
      overlay.classList.remove('hidden');
      overlay.classList.add('visible');
      const close = () => {
        overlay.classList.remove('visible');
        overlay.classList.add('hidden');
        sessionStorage.setItem('announcementSeen', 'true');
      };
      document.getElementById('announcement-close').addEventListener('click', close);
      document.getElementById('announcement-ack').addEventListener('click', close);
      overlay.addEventListener('click', e => { if (e.target === overlay) close(); });
      document.addEventListener('keydown', e => { if (e.key === 'Escape' && overlay.classList.contains('visible')) close(); });
    });
  </script>
</body>
</html>
